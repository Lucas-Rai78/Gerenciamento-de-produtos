<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="form-produto">
            <h2 id="form-titulo">Cadastrar Novo Produto</h2>
            

            <input type="hidden" id="produto-id">

            <div class="input-group">
                <input type="text" id="nome" placeholder="Nome do Produto" required>
                <input type="number" id="preco" step="0.01" placeholder="Preço (R$)" required>
            </div>

            <div class="input-group">
                <input type="number" id="peso" step="0.01" placeholder="Peso (g)" required>
                <input type="text" id="validade" placeholder="Validade (Ex: 2026-12-31)" required>
            </div>

            <textarea id="descricao" placeholder="Descrição do produto" required></textarea>

            <button type="submit" id="btn-submit">Cadastrar Produto</button>
            <button type="button" id="btn-cancelar" style="display: none; background-color: #7f8c8d; margin-top: 5px;" onclick="limparFormulario()">Cancelar Edição</button>
        </form>

        <h2>Produtos Cadastrados</h2>
        <div id="lista-produtos" class="grid-produtos"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
